<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Japanese Photo Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Japanese Photo Reader</h1>
      <label>
        Grammar question
        <textarea id="grammar-question" rows="2" placeholder="Ask about the grammar"></textarea>
      </label>
      <button id="select-area" type="button">Select area</button>
      <section id="highlight-section" hidden>
        <div class="section-title">Highlighted text</div>
        <pre id="highlighted-text"></pre>
        <button id="lookup-highlight" type="button">Dictionary lookup</button>
        <button id="google-highlight" class="secondary" type="button">Search Google</button>
      </section>
      <label>
        Analyze typed text
        <textarea id="text-input" rows="4" placeholder="日本語の文を入力"></textarea>
      </label>
      <button id="analyze-text" type="button">Analyze text</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
